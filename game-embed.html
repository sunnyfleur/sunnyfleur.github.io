<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.runner.title">Portfolio Runner Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: transparent;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 400px;
            min-height: 300px;
            border: 4px solid rgba(245, 169, 5, 0.5);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #121212;
        }

        #start-screen,
        #game-over-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            background-color: rgba(0, 0, 0, 0.72);
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        #game-over-screen {
            display: none;
        }

        #skill-popup {
            position: absolute;
            top: 50px;
            right: 50px;
            display: none;
            max-width: 250px;
            padding: 15px;
            color: white;
            background-color: rgba(245, 169, 5, 0.9);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            font-size: 14px;
            z-index: 5;
        }

        .button {
            margin: 10px;
            padding: 10px 20px;
            border: 0;
            border-radius: 5px;
            color: white;
            background-color: #f5a905;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .button:hover {
            transform: scale(1.06);
            background-color: #ff8c00;
        }

        h1 {
            margin: 0 0 10px;
            color: #f5a905;
            font-size: 32px;
        }

        h2 {
            margin: 0 0 20px;
            color: white;
            font-size: 20px;
        }

        p {
            max-width: 80%;
            margin: 0 auto 15px;
            color: #ddd;
            text-align: center;
            font-size: 14px;
        }

        #score-display {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            z-index: 5;
        }

        .pixel-art {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" class="pixel-art"></canvas>
        <div id="score-display">Score: 0</div>
        <div id="skill-popup"></div>

        <div id="start-screen">
            <h1>PORTFOLIO RUNNER</h1>
            <h2 id="runner-subtitle">Explore my skills and achievements</h2>
            <p id="runner-instructions">Press Space or click to jump. Double-click to jump higher.</p>
            <button id="start-button" class="button" type="button">START RUNNING</button>
        </div>

        <div id="game-over-screen">
            <h1 id="game-over-title">GAME OVER</h1>
            <h2 id="final-score">Score: 0</h2>
            <button id="restart-button" class="button" type="button">PLAY AGAIN</button>
            <button id="portfolio-button" class="button" type="button">VIEW PORTFOLIO</button>
        </div>
    </div>

    <script src="js/i18n.js?v=20260615-i18n"></script>
    <script src="js/game.js?v=20260615-i18n"></script>
</body>
</html>
