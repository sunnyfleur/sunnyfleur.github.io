<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Tran Hoang Kiet</title>
  <link rel="icon" href="/img/favicon/favicon.ico" sizes="any">
  <link rel="icon" href="/img/favicon/icon.svg" type="image/svg+xml">
  <!-- Google Fonts is external; every site URL is root-absolute. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;display=swap">
  <style>
    :root {
      color-scheme: light dark;
      --red: #e60012;
      --black: #0d0d0d;
      --white: #ffffff;
      --paper: #f2f0ec;
      --background: var(--paper);
      --ink: var(--black);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      isolation: isolate;
      background: var(--background);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .decoration {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }
    .decoration::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--red);
      clip-path: polygon(78% 0, 94% 0, 100% 55%, 100% 100%);
    }
    /* Typographic dots keep the halftone flat, without gradient images. */
    .decoration::after {
      content: "••••••••\A••••••••\A••••••••\A••••••••\A••••••••";
      position: absolute;
      left: 12px;
      bottom: 12px;
      white-space: pre;
      font: 18px/12px monospace;
      letter-spacing: 4px;
      color: var(--ink);
    }
    main {
      min-height: 100vh;
      min-height: 100svh;
      width: min(100%, 1100px);
      margin-inline: auto;
      padding: clamp(48px, 8vh, 100px) 24px 88px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .digits {
      display: flex;
      justify-content: center;
      gap: .055em;
      margin: 0 0 .2em;
      padding: .12em .07em;
      font: 400 clamp(90px, 23vw, 270px)/1.15 "Anton", "Arial Narrow", sans-serif;
    }
    .digit {
      display: block;
      width: .78em;
      background: var(--black);
      color: var(--white);
      border: 3px solid var(--black);
      transform: rotate(-9deg);
    }
    .digit:nth-child(3) {
      background: var(--white);
      color: var(--black);
      transform: rotate(6deg) translateY(-.04em);
    }
    .digit:nth-child(4) {
      background: var(--red);
      border-color: var(--red);
      transform: rotate(-5deg);
    }
    .copy {
      max-width: 100%;
      padding: 16px 12px 20px;
      background: var(--background);
    }
    h1 {
      max-width: 20ch;
      margin: 0 auto;
      padding: .1em .12em;
      font: 400 clamp(30px, 5.4vw, 64px)/1.2 "Anton", "Arial Narrow", sans-serif;
      text-transform: uppercase;
      transform: skewX(-4deg);
      overflow-wrap: anywhere;
    }
    .body-copy {
      max-width: 45ch;
      margin: 20px auto 0;
      font-size: 1rem;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      max-width: 100%;
      margin-top: 12px;
    }
    .button {
      position: relative;
      isolation: isolate;
      max-width: 100%;
      padding: 18px 30px;
      color: var(--white);
      font-size: 1rem;
      font-weight: 750;
      line-height: 1.4;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .button::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--black);
      clip-path: polygon(7% 0, 100% 0, 93% 100%, 0 100%);
    }
    .button:hover::before, .button:focus::before { background: var(--red); }
    .button:focus {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 480px) {
      main { padding-inline: 20px; }
      .decoration::before { clip-path: polygon(85% 0, 100% 0, 100% 50%); }
      .actions { flex-direction: column; }
    }
    @media (prefers-color-scheme: dark) {
      :root { --background: var(--black); --ink: var(--white); }
      .digit:nth-child(2) { border-color: var(--white); }
      .button { border-block: 2px solid var(--white); }
    }
    /* No animations or transitions, including under reduced motion. */
  </style>
</head>
<body>
  <div class="decoration" aria-hidden="true"></div>
  <main>
    <p class="digits"><span class="sr-only">404</span><span class="digit" aria-hidden="true">4</span><span class="digit" aria-hidden="true">0</span><span class="digit" aria-hidden="true">4</span></p>
    <div class="copy">
      <h1 data-vi="TRANG NÀY ĐI NHẦM ĐƯỜNG">THIS PAGE TOOK THE WRONG ROUTE</h1>
      <p class="body-copy" data-vi="Liên kết bị hỏng hoặc trang đã được chuyển đi.">The link is broken or the page has moved.</p>
    </div>
    <div class="actions">
      <a class="button" href="/index.html" data-vi="Về trang chủ">Back to portfolio</a>
      <a class="button" href="/index.html#portfolio" data-vi="Xem dự án">See the projects</a>
    </div>
  </main>
  <script>
    (() => {
      const vi = new URLSearchParams(location.search).get('lang') === 'vi'
        || (navigator.language || '').toLowerCase().startsWith('vi');
      document.documentElement.lang = vi ? 'vi' : 'en';
      if (vi) document.querySelectorAll('[data-vi]').forEach(element => {
        element.textContent = element.dataset.vi;
      });
    })();
  </script>
</body>
</html>
